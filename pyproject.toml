[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "py-cc-learn"
version = "1.0.0-rc1"
description = "Python rewrite of Claude Code Haha - multi-vendor AI coding assistant"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
authors = [
    {name = "py-cc-learn contributors"},
]
keywords = ["ai", "coding-assistant", "llm", "claude-code"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
]

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.3.0",
    "tiktoken>=0.7.0",
    "structlog>=24.4.0",
    "click>=8.1.0",
    "slowapi>=0.1.9",
    "pillow>=10.4.0",
    "cryptography>=43.0.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.0",
    "tree-sitter>=0.23.0",
    "docker>=7.1.0",
    "aiofiles>=24.1.0",
    "python-multipart>=0.0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "pre-commit>=3.8.0",
    "py-spy>=0.3.14; sys_platform != 'win32'",
    "memray>=1.14.0; sys_platform != 'win32'",
    "locust>=2.31.0",
]

[project.scripts]
haha = "server.cli:main"

[dependency-groups]
dev = [
    "pytest-cov>=7.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["server", "sandbox"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint.isort]
known-first-party = ["server", "sandbox"]
